name: Build and Push EmbeddingGemma 2 to GHCR

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'requirements.txt'
      - 'app.py'
      - '.github/workflows/build-ghcr.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: embeddinggemma-ghcr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build and publish container
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize package owner
        id: owner
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        shell: bash
        run: echo "name=${REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ghcr.io/${{ steps.owner.outputs.name }}/embeddinggemma2:latest
            ghcr.io/${{ steps.owner.outputs.name }}/embeddinggemma2:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
